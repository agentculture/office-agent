[project]
name = "office-cli"
version = "0.15.0"
description = "Office — CLI to manage sittings and meeting rooms in office maps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]
bamboohr = ["requests>=2.31"]
slack = ["slack-bolt>=1.18", "slack-sdk>=3.27"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
sso = [
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]
dynamo = ["boto3>=1.34"]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
]

[project.urls]
Homepage = "https://github.com/agentculture/office-agent"
Issues = "https://github.com/agentculture/office-agent/issues"

[project.scripts]
office = "office_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["office_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    # Test-only deps for the web stage. fastapi.testclient depends on
    # httpx; pulling them into dev so CI can exercise the [web] surface
    # without installing the optional extra.
    "fastapi>=0.110",
    "httpx>=0.28",
    # Stage 7 — SSO. CI exercises the auth-enabled path via TestClient
    # against a stub OIDC config; we never hit a real IdP.
    "authlib>=1.3",
    "itsdangerous>=2.1",
    # Stage 8 — DynamoDB. CI exercises the dynamo store via the
    # in-memory FakeDynamoClient; we still pull boto3 so the
    # production import path is sanity-checked at install time.
    "boto3>=1.34",
    # Drive-as-CMS (issue #44). CI exercises the hydrator against a
    # FakeDriveClient; google-api-python-client is pulled into dev so
    # the GoogleDriveClient import path is sanity-checked at install.
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
]

[tool.coverage.run]
source = ["office_cli"]
omit = ["office_cli/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["office_cli"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603", "B314", "B405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
